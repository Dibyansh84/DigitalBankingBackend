server:
  port: 8082

spring:
  application:
    name: ACCOUNT-SERVICE

  datasource:
    url: jdbc:postgresql://localhost:5432/digital_banking
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true